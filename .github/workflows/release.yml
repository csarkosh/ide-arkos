name: release
# Retired 2026-10-17: it signed ad hoc, and macOS keys Accessibility and the other permissions to
# an app's signature, so every switch between this and release-notarized made it forget them.
# Kept only to refuse, so `gh workflow run release` says where to go instead.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Retired: run release-notarized instead"
        required: true
        type: string

permissions:
  contents: read

jobs:
  refuse:
    runs-on: ubuntu-latest
    steps:
      - name: Use release-notarized
        run: |
          echo "This workflow is retired: it signed ad hoc, which makes macOS forget Arkos's permissions."
          echo "Run: gh workflow run release-notarized -f version=<version>"
          exit 1

name: release-notarized
# The release workflow with a Developer ID signature and notarization: macOS opens the download
# without the quarantine step, and updates keep the app's permissions. Manual only (the user's
# rule): nothing builds on push. Secrets: APPLE_CERT_P12 (base64 of a .p12 holding the
# "Developer ID Application" identity and Apple's Developer ID G2 intermediate),
# APPLE_CERT_PASSWORD, APPLE_API_KEY (the App Store Connect API key, .p8, base64),
# APPLE_API_KEY_ID, APPLE_API_ISSUER, ARKOS_RELEASE_KEY (the manifest's signing key), and
# HOMEBREW_TAP_DEPLOY_KEY (the private half of a deploy key that can write to csarkosh/homebrew-tap
# alone, for the cask). The only
# release path: the ad-hoc `release` workflow is retired, and a signed copy refuses an update
# its team did not sign.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 0.2.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    # The input reaches the scripts only through this variable, never pasted into them.
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Release from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "run this workflow on main, not $GITHUB_REF"
          exit 1
      # Actions pinned to full commit SHAs (looked up with `gh api`); the comment names the tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (v4)
        with:
          fetch-depth: 0
      - name: Check the version
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not major.minor.patch"; exit 1; }
          git rev-parse -q --verify "refs/tags/v$VERSION" && { echo "tag exists"; exit 1; } || true
      # Pinned by SHA, so the toolchain is named here rather than by the ref.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable, 2026-10-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (v2)
      - name: Bump the version and tag
        run: |
          sed -i '' -E "s/^version = \"[0-9.]+\"\$/version = \"$VERSION\"/" Cargo.toml
          grep -q "version = \"$VERSION\"" Cargo.toml
          cargo update -w -q
          git config user.name "release workflow"
          git config user.email "release@csarko.sh"
          git commit -am "Release $VERSION"
          git tag "v$VERSION"
      - name: Build
        # The source root and the Cargo home are remapped out of the binaries, so a crash report's
        # file reads /src/crates/... or /cargo/... and never the runner's folders (the toolchain's
        # own paths already read /rustc/<hash>). Cargo hands rustc the workspace's own sources by
        # relative paths, crates/..., which the first prefix does not match, hence the third. A
        # crash report names the build by its commit, so a build that could not read it fails.
        run: |
          export RUSTFLAGS="--remap-path-prefix=$PWD=/src --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=crates=/src/crates"
          cargo build --release --locked -p arkos -p arkosd -p release-tool
          # The version is read first, so a binary that crashes or prints nothing fails here too.
          for BIN in arkos arkosd; do
            V=$("target/release/$BIN" --version)
            case "$V" in "$BIN "*" ("*")") ;; *) echo "$BIN --version said '$V'"; exit 1 ;; esac
            case "$V" in *"(unknown)") echo "$BIN was built without its commit hash"; exit 1 ;; esac
          done
      - name: Signing identity
        # A keychain of its own for the run, the identity imported into it, and codesign allowed
        # to use the key without a prompt. The runner is thrown away afterwards.
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/identity.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/identity.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          [ -n "$IDENTITY" ] || { echo "no valid Developer ID Application identity in the imported .p12"; exit 1; }
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Bundle, sign, notarize
        env:
          ARKOS_RELEASE_KEY: ${{ secrets.ARKOS_RELEASE_KEY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p dist
          ZIP=$(ARKOS_CHANNEL=release sh packaging/bundle.sh "$VERSION" target/release dist)
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ZIP=$(NOTARY_KEY="$RUNNER_TEMP/notary.p8" sh packaging/notarize.sh "$ZIP")
          rm -f "$RUNNER_TEMP/notary.p8"
          sh packaging/dsym.sh "$VERSION" target/release dist
          URL="https://github.com/$REPO/releases/download/v$VERSION/$(basename "$ZIP")"
          sh packaging/manifest.sh "$VERSION" "$(git rev-parse --short HEAD)" "$ZIP" "$URL" dist
          target/release/release-tool sign --key-env ARKOS_RELEASE_KEY dist/manifest.json > dist/manifest.json.sig
      - name: Check what will be published
        run: |
          # The signature checks against the first key the IDE trusts, as an installed IDE would.
          KEY=$(sed -n 's/^ *"\(.*\)",$/\1/p' crates/protocol/src/release_key.rs | head -1)
          target/release/release-tool verify --public "$KEY" dist/manifest.json dist/manifest.json.sig
          [ "$(cat "dist/Arkos IDE.app/Contents/Resources/channel")" = release ] || { echo "the bundle is not on the release channel"; exit 1; }
          GOT=$("dist/Arkos IDE.app/Contents/MacOS/arkosd" --version)
          echo "$GOT"
          case "$GOT" in
            "arkosd $VERSION "*) ;;
            *) echo "the bundled arkosd is not $VERSION"; exit 1 ;;
          esac
          spctl -a -t exec -vv "dist/Arkos IDE.app" 2>&1 | tee /dev/stderr | grep -q 'source=Notarized Developer ID'
      - name: Record the release in the cask
        # The cask's version and the notarized zip's sha256, committed after the tagged release
        # commit and pushed with it, so homebrew/arkos-ide.rb always names the latest release.
        run: |
          sh packaging/cask.sh "$VERSION" "dist/Arkos-IDE-$VERSION-arm64.zip"
          git commit -qm "Cask: arkos-ide $VERSION" homebrew/arkos-ide.rb
      - name: Push the release commit and tag
        # Both or neither: a tag without its commit on main (or the reverse) is never published.
        run: git push --atomic origin HEAD:main "v$VERSION"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The commits since the last release, without the release commit or the cask's records.
          PREV=$(git describe --tags --abbrev=0 "v$VERSION~1" 2>/dev/null || true)
          if [ -n "$PREV" ]; then NOTES=$(git log --format='- %s' --invert-grep --grep='^Cask: arkos-ide ' "$PREV..v$VERSION~1"); else NOTES="First release."; fi
          gh release create "v$VERSION" "dist/Arkos-IDE-$VERSION-arm64.zip" "dist/Arkos-IDE-$VERSION-dSYM.zip" dist/manifest.json dist/manifest.json.sig --title "Arkos IDE $VERSION" --notes "$NOTES"
      - name: Publish the Homebrew cask
        # After the release, since the cask points at its zip. The deploy key can write to the tap
        # alone, and GitHub's host keys come from its API rather than a first connection's word.
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY is not set: the release is out, but the cask still names the last one. Add the key (docs/development.md, Releasing) or run 'sh packaging/tap.sh $VERSION' from main."
            exit 1
          fi
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$RUNNER_TEMP/tap_key"
          chmod 600 "$RUNNER_TEMP/tap_key"
          gh api meta --jq '.ssh_keys[]' | sed 's/^/github.com /' > "$RUNNER_TEMP/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes"
          sh packaging/tap.sh "$VERSION"
          rm -f "$RUNNER_TEMP/tap_key"

[package]
name = "sarkos"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
protocol.workspace = true
serde.workspace = true
postcard.workspace = true
anyhow.workspace = true
libc.workspace = true
# runtime_shaders: compiles the Metal shaders at launch, so the build needs only Command Line Tools, not Xcode.
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
alacritty_terminal = "0.26"
futures = "0.3"
serde_json = "1"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSProcessInfo", "NSString", "NSObjCRuntime"] }

[dev-dependencies]
tempfile.workspace = true
proptest = "1"

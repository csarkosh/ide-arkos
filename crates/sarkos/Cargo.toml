[package]
name = "sarkos"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
toml = "0.8"
protocol.workspace = true
serde.workspace = true
postcard.workspace = true
anyhow.workspace = true
libc.workspace = true
# runtime_shaders: compiles the Metal shaders at launch, so the build needs only Command Line Tools, not Xcode.
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
alacritty_terminal = "0.26"
futures = "0.3"
serde_json = "1"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSProcessInfo", "NSString", "NSObjCRuntime"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy", "dump-load", "parsing"] }
similar = "2"

[dev-dependencies]
tempfile.workspace = true
proptest = "1"

[package]
name = "arkos"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
toml = "0.8"
toml_edit.workspace = true
protocol.workspace = true
telemetry.workspace = true
serde.workspace = true
postcard.workspace = true
anyhow.workspace = true
libc.workspace = true
# runtime_shaders: compiles the Metal shaders at launch, so the build needs only Command Line Tools, not Xcode.
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
alacritty_terminal = "0.26"
futures = "0.3"
serde_json.workspace = true
# The agent guide skill's version stamp (guide.rs).
sha2.workspace = true
objc2 = "0.6"
# The effect layer under the window (effects/layer.rs), through gpui's own metal crate and its
# geometry types.
metal = "0.29"
core-graphics-types = "0.1"
# Already in the tree through gpui: the AppKit view behind the window, for docking (spec 8).
raw-window-handle = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSProcessInfo", "NSString", "NSObjCRuntime", "NSDictionary", "NSValue", "NSURL", "NSURLRequest", "NSGeometry", "NSError", "NSData"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy", "dump-load", "parsing"] }
similar = "2"
# Markdown parsing for the editor's block layer (md_blocks).
pulldown-cmark.workspace = true
# Already in the tree through gpui and others: grapheme boundaries for the editing core.
unicode-segmentation = "1"
# Already in the tree through other crates: display widths for re-aligning markdown tables.
unicode-width = "0.2"
# The browser pane (spec 8): Chrome's pid, the mouse, the screens and arkos's own window. Default
# features off: the full AppKit binding is a long compile, and only these modules are used.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSEvent", "NSRunningApplication", "NSApplication", "NSWindow", "NSScreen", "NSResponder", "NSGraphics", "NSView", "NSColor", "NSPasteboard", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "block2"] }
# The web pane (web pane spec, section 3): a WKWebView child of the window. Default features off,
# as for AppKit: only the view, its configuration, the two delegates and the data store.
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebView", "WKWebViewConfiguration", "WKPreferences", "WKWebpagePreferences", "WKNavigation", "WKNavigationDelegate", "WKUIDelegate", "WKWebsiteDataStore", "WKProcessPool", "WKNavigationAction", "WKNavigationResponse", "WKFrameInfo", "WKWindowFeatures", "WKBackForwardList", "WKUserContentController", "WKError", "WKFoundation", "WKSnapshotConfiguration", "block2", "objc2-app-kit", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFString", "CFNumber", "CFCGTypes"] }
# gpui's CoreVideo crate: the pixel buffer type its surface element paints (video tab).
core-video = "0.4.3"
# The video tab's player (av_player.rs). Default features off, as for AppKit: only the player, its
# item, the video output and the asset are used.
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "AVAsset", "AVAsynchronousKeyValueLoading", "objc2-core-media", "objc2-core-video", "block2", "objc2-core-foundation"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMTime"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVPixelBuffer", "CVBuffer", "CVImageBuffer"] }
# The seek's completion handler (the version objc2 0.6 pairs with, already in the tree).
block2 = "0.6"
# Already in the tree through gpui (which pins 0.10.0): `TCFType`, to wrap a pixel buffer in
# core-video's type, which does not re-export the trait.
core-foundation = "0.10"

[dev-dependencies]
tempfile.workspace = true
proptest = "1"

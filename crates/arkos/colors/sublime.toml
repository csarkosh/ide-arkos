# Sublime: Sublime Text's classic Monokai look, used by Material Sublime.
# The schema of every key is in docs/themes.md.
name = "sublime"
title = "Sublime"
appearance = "dark"

[chrome]
window_bg = "#272822"
title_bar = "#1e1f1c"
status_bar = "#1e1f1c"
sidebar = "#1e1f1c"
tab_bar = "#272822"
tab_active = "#272822"
tab_inactive = "#272822"
border = "#3e3d32"
split_handle = "#3e3d32"
split_handle_hover = "#75715e"
focus_ring = "#66d9ef"
text = "#f8f8f2"
text_dim = "#b3ae96"
banner = "#34352d"

[terminal]
background = "#272822"
foreground = "#f8f8f2"
cursor = "#f8f8f2"
selection = "#49483e"
black = "#3e3d32"
red = "#ff4d8d"
green = "#a6e22e"
yellow = "#e6db74"
blue = "#66d9ef"
magenta = "#ae81ff"
cyan = "#a1efe4"
white = "#f8f8f2"
bright_black = "#a59f85"
bright_red = "#ff7aa8"
bright_green = "#c4f05c"
bright_yellow = "#f4ea96"
bright_blue = "#8ee6f7"
bright_magenta = "#c9a8ff"
bright_cyan = "#c4f7ef"
bright_white = "#ffffff"

[semantic]
working = "#66d9ef"
waiting = "#fd971f"
bell = "#e6db74"
error_banner = "#4a1a2a"
find_match = "#4a4a30"
find_current = "#6b5420"

[tree]
added = "#a6e22e"
modified = "#e6db74"
deleted = "#ff4d8d"
untracked = "#66d9ef"
ignored = "#a59f85"

[viewer]
keyword = "#ff4d8d"
string = "#e6db74"
comment = "#a59f85"
number = "#ae81ff"
function = "#a6e22e"
type_name = "#66d9ef"
constant = "#ae81ff"
operator = "#ff4d8d"
punctuation = "#f8f8f2"

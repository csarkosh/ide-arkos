name = "runic"
description = "Digital rain: faint green runes falling under a black ground, glowing edges and glitching text."
wash = "wash.metal"
glyphs = "glyphs.metal"       # optional; absent, gpui draws text as always
frame_rate = 30               # 1 to 60; the wash's frames per second while anything moves
scale = 0.5                   # 0.1 to 1.0; the wash's pixels per window pixel, each side: a pixel
                              # a point on a Retina display, crisp enough for the frames and the
                              # scene, at a quarter of the cost of full (11 to 14 ms a frame there)
ui_text_bump = 0              # 0 to 4 points added to the project window's UI text
gap = 16                      # 0 to 16 points round each pane: room for its frame, 5 points out,
                              # and 6 points of ground between two neighbours' frames
edge_gap = 11                 # 0 to 16 points off the title bar and the window's edges (the sidebar's
                              # margin too): 6 of ground beyond a frame, as between two frames
title_pad = 8                 # 0 to 24 points inside the title bar at both ends: its words and
                              # icons on their plates
sidebar_pad = 2               # 0 to 24 points before each row and header of the sidebar: room for
                              # the chevron on the selected row (its frame lies outside its column)
bar_end_clear = 48            # 0 to 64 points at a pane bar's right end: its lamp, 38 in, left of the +
ink_borders = true            # the app hides its own 1 px borders; the wash draws the edges
sidebar_margin = true         # the sidebar keeps the gap round it as a pane does, framed as one
highlights = "effect"         # "effect": the wash paints the selected and hovered rows and the
                              # hovered tab from the highlight blocks; "app" (the default): the
                              # app keeps its own fills and reports no highlight blocks
keys_ring = "glow"            # the keyboard's ring in the sidebar: a glowing line, a faint wash
menus = "glow"                # "ink", "glow" or "app" (the default): how the menus and popovers
                              # look while the effect is on
glyph_motion = true           # the glyph shader reads the clock, so the text is redrawn on a timer
glyph_rate = 10               # 1 to 20; the text's redraws a second while glyph_motion is on
terminal_decode = true        # the terminal decodes changed cells and brightens fresh ones;
                              # needs glyph_motion, whose timer it runs on
paper_alpha = 0.6             # 0.5 to 1.0; a terminal's paper over the wash: the wash draws a
                              # pane's body as it should reach the screen through it (its top band,
                              # its skyline, the rain as faint as a source file's), as overworld does
document_paper_alpha = 0.6    # 0.5 to 1.0; a markdown or viewer tab's paper, the terminal's, so
                              # a document's body reads as a terminal's (absent, paper_alpha)
menu_paper_alpha = 0.92        # 0.5 to 1.0; a menu's paper over the backdrop the wash paints for it:
                              # nearly opaque, so its rows read over the rain (Cyrus, 2026-11-17)
chrome_alpha = 0.0            # 0.0 to 1.0; the bars and the sidebar over the wash
active_tab_alpha = 0.0        # 0.0 to 1.0; the active tab over the wash: clear, the wash paints
                              # it as a doorway with its line and its lamp
text_contrast = 0.0           # 0.0 to 1.0; how far the text moves towards ink while the effect is on
scenes = ["tokyo", "matrix-city"]  # the sidebar's scene a theme names with `[effect] scene`: a
                              # rainy Tokyo skyline (Tokyo Rain), or a digital horizon (The Matrix)
scene_titles = ["Tokyo", "Matrix City"]  # the names people see, in the order of scenes
scene_aliases = { city = "tokyo", code = "matrix-city" }  # the names a theme used before, which still work

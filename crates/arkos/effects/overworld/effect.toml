name = "overworld"
description = "A night overworld in pixel art across the window: panes framed like game menus on a night ground, stone tab bars, a sky for a title bar, a castle scene, and text typed in like dialogue."
wash = "wash.metal"
glyphs = "glyphs.metal"       # the font's own text; new terminal text is typed in and lit
frame_rate = 30               # 1 to 60; the wash's frames per second while anything moves: the
                              # art is slow, but the wash paints the chrome and the active tab, so
                              # a tab click, a hover, a sidebar drag and Cmd+B keep up with the app
scale = 1.0                   # 0.1 to 1.0; full size, so every 3 point art pixel stays crisp
sidebar_pad = 12              # 0 to 24 points before each row and header of the sidebar: room for
                              # its frame (two art pixels) and the cursor bobbing inside it
gap = 15                      # 0 to 16 points round each pane: five art pixels, two for each
                              # pane's frame and one of night ground between two frames
ink_borders = false           # the app keeps drawing its own 1 px borders, inside the frames
highlights = "effect"         # "effect": the wash paints the selected and hovered rows, the hovered
                              # tab and the active tabs with their lanterns; "app" (the default):
                              # the app keeps its own fills and reports no highlight blocks
menus = "app"                 # "ink", "glow" or "app" (the default): how the menus and popovers
                              # look while the effect is on
paper_alpha = 0.6             # 0.5 to 1.0; a terminal's or a document's paper over the wash: the
                              # night shows faintly behind both (the wash's PAPER is this number)
chrome_alpha = 0.0            # 0.0 to 1.0; the bars and the sidebar over the wash: clear, so the
                              # scene and the stars show
body_bars_alpha = 1.0         # 0.0 to 1.0; the bars inside a tab's body over the wash: opaque, so
                              # they keep their own colour
active_tab_alpha = 0.0        # 0.0 to 1.0; the active tab over the wash: clear, the wash paints it
                              # and its lantern
text_contrast = 0.0           # 0.0 to 1.0; how far the text moves towards ink while the effect is on
terminal_paint = true         # new terminal text is typed in like dialogue: the terminal stamps a
                              # changed cell once and the glyph shader shows it from its start

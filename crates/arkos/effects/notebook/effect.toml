name = "notebook"
description = "A composition notebook: the marbled cover, ruled cream pages, pencil lines, a highlighter, and terminal text written in by hand."
wash = "wash.metal"
glyphs = "glyphs.metal"       # optional; absent, gpui draws text as always
frame_rate = 30               # 1 to 60; the wash's frames per second while anything moves
scale = 1.0                   # 0.1 to 1.0; full size, so the rules and the margin stay one point
ui_text_bump = 1              # 0 to 4 points added to the project window's UI text
title_pad = 14                # 0 to 24 points inside the title bar at both ends: room round the
                              # title's words and icons inside the cover's label
binder = 22                   # 0 to 32 points between the sidebar and the panes: the spiral's gutter
ink_borders = true            # the app hides its own 1 px borders; the wash draws pencil lines
highlights = "effect"         # "effect": the wash paints the selected and hovered rows and the
                              # hovered tab from the highlight blocks; "app" (the default): the
                              # app keeps its own fills and reports no highlight blocks
menus = "ink"                 # "ink", "glow" or "app" (the default): how the menus and popovers
                              # look while the effect is on
paper_alpha = 0.5             # 0.5 to 1.0; a terminal's or document's paper over the wash
chrome_alpha = 0.0            # 0.0 to 1.0; the bars and the sidebar over the wash
active_tab_alpha = 0.55       # 0.0 to 1.0; the active tab over the wash
text_contrast = 0.3           # 0.0 to 1.0; how far the text moves towards ink while the effect is on
terminal_paint = true         # new terminal text is written in by a pen: the terminal stamps a changed
                              # cell once and the glyph shader paints it in; needs a glyphs file

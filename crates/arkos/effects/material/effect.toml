name = "material"
description = "Material 3 as a web workspace: rounded white cards on a pale frame, underlined tabs, a pill on the selected row, a search bar for a title bar."
wash = "wash.metal"
# No glyph shader: the text stays as the font draws it.
frame_rate = 30               # 1 to 60; the wash's frames per second while anything moves
scale = 1.0                   # 0.1 to 1.0; full size, so the cards' corners and the dividers are crisp
ui_text_bump = 0              # 0 to 4 points added to the project window's UI text
title_pad = 10                # 0 to 24 points inside the title bar at both ends: room round the
                              # title's words inside the search bar
gap = 8                       # 0 to 16 points round each pane: the frame between the cards
pane_radius = 14              # 0 to 24; the cards' corner radius (the wash's CARD_RADIUS), so the
                              # focused pane's ring is rounded to match
ink_borders = true            # the app hides its own 1 px borders; the wash draws what lines remain
highlights = "effect"         # "effect": the wash paints the selected and hovered rows, the hovered
                              # tab and the active tabs' underlines; "app" (the default): the app
                              # keeps its own fills and reports no highlight blocks
menus = "app"                 # "ink", "glow" or "app" (the default): how the menus and popovers
                              # look while the effect is on
paper_alpha = 0.5             # 0.5 to 1.0; a terminal's or document's paper over the wash
chrome_alpha = 0.0            # 0.0 to 1.0; the bars and the sidebar over the wash
active_tab_alpha = 0.0        # 0.0 to 1.0; the active tab over the wash: none, it is underlined
text_contrast = 0.0           # 0.0 to 1.0; how far the text moves towards ink while the effect is on

# Timo Purple: Timo's Codex theme (accent #00ffff, background #330076, contrast 70) carried over
# to Arkos. The schema is in docs/themes.md.
name = "timo-purple"
appearance = "dark"
[chrome]
window_bg = "#330076"
title_bar = "#2a0062"
status_bar = "#2a0062"
sidebar = "#2a0062"
tab_bar = "#2a0062"
tab_active = "#330076"
tab_inactive = "#2a0062"
border = "#4b2a98"
split_handle = "#4b2a98"
split_handle_hover = "#7a5ad0"
focus_ring = "#00ffff"
text = "#f3edff"
text_dim = "#c4b6ea"
banner = "#3b1a86"
[terminal]
background = "#330076"
foreground = "#f3edff"
cursor = "#00ffff"
selection = "#1a6b45"
black = "#2a0062"
red = "#ff8a9e"
green = "#5fe39a"
yellow = "#ffd166"
blue = "#8fb8ff"
magenta = "#e39bff"
cyan = "#00ffff"
white = "#e9e2ff"
bright_black = "#9a86d0"
bright_red = "#ffb3c0"
bright_green = "#8df2b8"
bright_yellow = "#ffe08a"
bright_blue = "#b6cfff"
bright_magenta = "#efbfff"
bright_cyan = "#9dffff"
bright_white = "#ffffff"
[semantic]
working = "#5fe39a"
waiting = "#ffd166"
bell = "#ff8a9e"
error_banner = "#5a1a3a"
find_match = "#15553a"
find_current = "#1f7a52"
[tree]
added = "#8fd9a8"
modified = "#ffd166"
deleted = "#ff8a9e"
untracked = "#c9b8e8"
ignored = "#a08ed6"
[viewer]
keyword = "#e39bff"
string = "#8fd9a8"
comment = "#a08ed6"
number = "#ffd166"
function = "#8fb8ff"
type_name = "#7fd4d4"
constant = "#ffb3c0"
operator = "#e9e2ff"
punctuation = "#c4b6ea"

# The schema of every key is in docs/themes.md.
# Matrix: black with phosphor green text, designed with the matrix effect. The window and the
# terminal are pure black; the bars, the sidebar and the inactive tabs are a very dark green
# black, so the window keeps its shape with the effect off. The ANSI colours keep their meaning
# while leaning toward the phosphor family. Every colour drawn as text has an sRGB luminance of
# at least 0.47, so the matrix glyph shader lights all of it with a halo (it treats anything
# under 0.45 as dark text), and every colour clears the contrast rules of docs/themes.md.
name = "matrix"

[effect]
name = "matrix"

[chrome]
window_bg = "#000000"
title_bar = "#060b07"
status_bar = "#060b07"
sidebar = "#060b07"
tab_bar = "#060b07"
tab_active = "#000000"
tab_inactive = "#060b07"
border = "#133a1a"
split_handle = "#133a1a"
split_handle_hover = "#2a6a34"
focus_ring = "#4af626"
text = "#4af626"
text_dim = "#2e9e3a"
banner = "#0c160e"


# The schema of every key is in docs/themes.md.
# Arabia Solar: Timo Purple's daytime twin. The warm sand and cream of Peach Watercolor with a
# burnt-orange accent, under the overworld effect: the same framed panes, stone tab bars and
# castle, seen by day with a sun in place of the moon, and set in the same pixel face.
name = "arabia-solar"
appearance = "light"

[effect]
name = "overworld"

# A pixel face for a pixel-art window (SIL Open Font License, github.com/rektdeckard/departure-mono;
# `brew install --cask font-departure-mono`). Its pixels are whole at multiples of 11 px, and of
# 5.5 px on a Retina screen, so `grid` draws every text size at the nearest multiple of 5.5 (a
# preset of 14 or 18 at 16.5, the chrome's labels at 11). Without the font installed, the
# config's own font is used at its own sizes.
[font]
prose = "Departure Mono"
ui = "Departure Mono"
terminal = "Departure Mono"
grid = 5.5

[chrome]
window_bg = "#fff6ef"
title_bar = "#fbe3d3"
status_bar = "#fbe3d3"
sidebar = "#fdeadf"
tab_bar = "#fbe3d3"
tab_active = "#fff6ef"
tab_inactive = "#fbe3d3"
border = "#efcdb8"
split_handle = "#efcdb8"
split_handle_hover = "#dca98a"
focus_ring = "#c2410c"
text = "#5a3e32"
text_dim = "#7a5a4a"
banner = "#f9dcc8"

[terminal]
background = "#fff6ef"
foreground = "#4a3028"
cursor = "#c2410c"
selection = "#f8cfb4"
black = "#4a3028"
red = "#b3261e"
green = "#2f7a3a"
yellow = "#8a5a00"
blue = "#1d5fbf"
magenta = "#9a3a86"
cyan = "#0f6e72"
white = "#7a5a4a"
bright_black = "#7a5a4a"
bright_red = "#c42b2b"
bright_green = "#2f7f3f"
bright_yellow = "#8a6200"
bright_blue = "#2b66c4"
bright_magenta = "#a3419a"
bright_cyan = "#0f7076"
# The terminal foreground: Claude Code's Arkos theme draws its text in bright white over faint
# tinted bands (the selection, diff words), which need the darkest ink to keep 4.5:1.
bright_white = "#4a3028"

[semantic]
working = "#c2410c"
waiting = "#8a5a00"
bell = "#8a5a00"
error_banner = "#f7d4d0"
find_match = "#f8dcc8"
find_current = "#f5e3a1"

[tree]
added = "#2f7a3a"
modified = "#8a5a00"
deleted = "#b3261e"
untracked = "#7a3fa8"
ignored = "#8a6a5a"

[viewer]
keyword = "#9a3a86"
string = "#2f7a3a"
comment = "#8a6a5a"
number = "#8a5a00"
function = "#c2410c"
type_name = "#0f6e72"
constant = "#b3261e"
operator = "#5a3e32"
punctuation = "#7a5a4a"

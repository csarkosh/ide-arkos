# The student: an algorithms course in one folder. The week's lecture notes rendered on the
# left with a problem set's code in the next tab, and Claude Code on the right explaining why
# the problem set's tests fail, fixing it, and adding practice questions to the notes, which
# change on the left as it writes. Shot in Composition Notebook: a marbled cover, ruled pages,
# the terminal written in by hand.

[scene]
name = "student"
caption = "The student"

[demo]
name = "algorithms"
dir = "~/Projects/algorithms"
fixture = "scripts/shoot/demo/study"

[window]
width = 1320
height = 860
preset = "compact"
sidebar_width = 230
expanded = ["lectures", "psets", "psets/pset4"]
theme = { dark = "composition-notebook", light = "composition-notebook" }

[[pane]]
name = "notes"
view = "lectures/06-dynamic-programming.md"

[[pane]]
name = "pset"
view = "psets/pset4/knapsack.py"

[[pane]]
name = "tutor"
claude = "The tests in psets/pset4 fail. Read lectures/06-dynamic-programming.md first, then explain the bug to me in two or three plain sentences, as a classmate would. Fix psets/pset4/knapsack.py and run the tests with: cd psets/pset4 && python3 -m unittest. Then add a Practice section at the end of the lecture notes with three short questions on memoisation versus tabulation, and tick the knapsack item in its checklist. Change nothing else."

# For the Inbox's range: more sessions, each in another state. Working (stress runs a five-minute check), New (essay, a session just opened) and Done (two from earlier in the week), beside the tutor.
[[pane]]
name = "stress"
claude = "Run python3 psets/pset4/stress.py in the foreground with a ten minute timeout (it takes several minutes; do not run it in the background), then tell me in one line whether any case disagreed with the brute force."

[[pane]]
name = "essay"
new = true

[[ended]]
name = "pset 3"
line = "All 12 tests pass now: the memo table was one row short."
mins_ago = 1500

[[ended]]
name = "flashcards"
line = "I wrote 40 cards for lectures 1 to 5 into cards.csv."
mins_ago = 2900

[layout]
split = "horizontal"
ratio = 0.5
first = { tabs = ["notes", "pset"] }
second = { tabs = ["tutor", "stress", "essay"] }

[[shot]]
name = "dark"
theme = "dark"
wait = { tutor = "waiting" }
changed = { tutor = 1 }
after_secs = 30
timeout_secs = 300

# The same moment in the Inbox layout, for the apps page's Inbox and Grid switch: the sessions as a list
# by what they ask of you, one shown at full size with the files it opened beside it.
[[shot]]
name = "dark-inbox"
theme = "dark"
layout = "inbox"
timeout_secs = 60
# Side by side, as Cyrus asked for this one (2026-11-14): the files pane dragged by its number
# from the top, where a narrow window stacks it, onto the session's right edge.
drag = [[0.2, 0.051], [0.96, 0.72]]

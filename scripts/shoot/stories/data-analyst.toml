# The data analyst: the weekly signups report rendered on the left (a table to fill and a bar
# chart), Claude Code on the right writing the script that computes this week's numbers and
# putting them into the report, and the raw export below it. Shot in Material Navy, and in the
# Inbox in every Material dark theme (Cyrus, 2026-11-19), each pane's number on a chip of its
# own colour.

[scene]
name = "data-analyst"
caption = "The data analyst"

[demo]
name = "metrics"
dir = "~/Projects/metrics"
fixture = "scripts/shoot/demo/metrics"

[window]
width = 1320
height = 860
preset = "compact"
sidebar_width = 220
expanded = ["data"]
theme = { dark = "navy", light = "navy" }

[[pane]]
name = "report"
view = "report.md"

[[pane]]
name = "numbers"
claude = "Bring report.md up to this week. Write scripts/weekly.py (Python standard library only) that reads data/signups.csv and prints, for the latest week, visits, signups and conversion (signups over visits) by channel, with the change in signups from the week before. Run it, then fill the This week table in report.md with its numbers, add the latest week to the bar chart (its date at the end of the x-axis and its total at the end of the bars), and write one sentence under the table on what moved most. Keep the file's shape and change nothing else."

[[pane]]
name = "data"
view = "data/signups.csv"

# For the Inbox's range: more sessions, each in another state. Needs you (churn asks a question), Working (backfill rebuilds 52 weeks) and Later (q3 deck, put off three hours), beside numbers.
[[pane]]
name = "backfill"
claude = "Run python3 scripts/backfill.py in the foreground with a ten minute timeout (it takes several minutes; do not run it in the background), then tell me in one line whether any week's totals changed."

[[pane]]
name = "churn"
claude = "Before you do anything else, use your AskUserQuestion tool to ask me one question: should churn count paused accounts as churned? Offer yes and no as the options. Then wait for my answer."

[[pane]]
name = "q3 deck"
claude = ""
later_mins = 180
line = "Turn the Q3 numbers into five slides for Monday's review"

[layout]
split = "horizontal"
ratio = 0.55
first = { tabs = ["report"] }
second = { split = "vertical", ratio = 0.6, first = { tabs = ["numbers", "backfill", "churn", "q3 deck"] }, second = { tabs = ["data"] } }

[[shot]]
name = "dark"
theme = "dark"
wait = { numbers = "waiting" }
changed = { numbers = 1 }
after_secs = 30
timeout_secs = 300
# The divider between the session and the report, from about two thirds across to 0.565, so the
# report's table has room for its headers (Cyrus, 2026-11-21: they wrapped, "Chann el") and the
# session keeps room for the table Claude Code prints. The Inbox shots below move the session's
# pane by its number first, which makes a new split, so this ratio does not carry into them.
drags = [[[0.6655, 0.72], [0.565, 0.72]]]

# The same moment in the Inbox layout, for the apps page's Inbox and Grid switch: the sessions as a list
# by what they ask of you, one shown at full size with the files it opened beside it.
[[shot]]
name = "dark-inbox"
theme = "dark"
layout = "inbox"
timeout_secs = 60
# Side by side, as Cyrus asked for this one (2026-11-14): the files pane dragged by its number
# from the top, where a narrow window stacks it, onto the session's right edge.
drag = [[0.188, 0.06], [0.96, 0.72]]
# Then the divider, from where the Inbox leaves it (the session 60%) to give the files pane the
# room its table needs, so no column header wraps; the session keeps 46%, or the table Claude
# Code prints in the terminal wraps instead.
drags = [[[0.6655, 0.72], [0.55, 0.72]]]

# The same Inbox, its panes where the drags left them, in the other Material dark themes, for
# the apps page's choice of the data analyst's theme.
[[shot]]
name = "ocean-inbox"
theme = "material-ocean"
layout = "inbox"
timeout_secs = 60

[[shot]]
name = "palenight-inbox"
theme = "material-palenight"
layout = "inbox"
timeout_secs = 60

[[shot]]
name = "sublime-inbox"
theme = "material-sublime"
layout = "inbox"
timeout_secs = 60

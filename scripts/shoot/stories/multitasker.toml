# The multi tasker: one window, three Claude Code sessions on three unrelated workstreams,
# each orchestrating its own subagents, and behind two of them a shorter session on yet
# another workstream that has finished and waits on you, so the tabs show both marks. No
# sidebar: just the sessions. Shot in the built-in tokyo-rain theme: Navy with the runic effect.
# This is the hero.

[scene]
name = "multitasker"
caption = "The multi tasker"

[demo]
name = "workbench"
dir = "~/Projects/workbench"
fixture = "scripts/shoot/demo"
only = ["lantern", "mail", "trip", "blog", "budget"]
# Each folder becomes a repository of its own: three independent projects side by side.
repos = ["lantern", "mail", "trip", "blog", "budget"]

[window]
width = 1320
height = 860
preset = "compact"
sidebar = "collapsed"
theme = { dark = "tokyo-rain", light = "navy" }

[[pane]]
name = "lantern"
cwd = "lantern"
claude = "Add rate limiting to POST /links: 20 requests a minute per client address, answered 429 with a Retry-After header. Split the work across subagents: one writes src/limiter.js with its tests, one wires it into src/server.js with route tests that start the server on a free port, one documents it in README.md. Then run npm test and fix anything that fails."

[[pane]]
name = "inbox"
cwd = "mail"
claude = "Triage my inbox: the messages are in inbox/, one file each. Write triage.md grouping them by urgency (today, this week, ignore) with a one-line summary and the action each needs, then draft a reply for every message that needs one into replies/<same name>.md, short and plain, in my voice. Use a subagent per message for the drafts, then review them together for consistency."

[[pane]]
name = "blog"
cwd = "blog"
claude = "Look at the posts in posts/ and tell me in three short lines which one is newest, which one has no image, and which title is the weakest. Do not change any file."

[[pane]]
name = "budget"
cwd = "budget"
claude = "Read budget.csv and tell me in two lines which category grew the most from July to September and by how much. Do not change any file."

[[pane]]
name = "lisbon"
cwd = "trip"
claude = "Plan the trip in notes.md. Write itinerary.md day by day with times and how we get around, budget.md with a table that totals against the budget in the notes, and packing.md. Use one subagent for the itinerary and one for the budget, then reconcile them so the budget matches the plan."

[layout]
split = "horizontal"
ratio = 0.5
first = { tabs = ["lantern", "blog"] }
second = { split = "vertical", ratio = 0.5, first = { tabs = ["inbox", "budget"] }, second = { tabs = ["lisbon"] } }

# The moment: the sessions have fanned out their subagents and the first files are in, and
# the two short sessions behind them have answered and wait on you (the waiting mark on an
# inactive tab). A session waiting on its own background agents reports "waiting" too (its
# prompt is idle), and the inbox's own turn is over within about a minute, before its files
# and the lantern's are all in, so no working state is asked for (four runs in a row went
# unmet on it); the work shows through the changed files, and the tabs' marks through the
# two short sessions.
[[shot]]
name = "dark"
theme = "dark"
wait = { blog = "waiting", budget = "waiting" }
changed = { inbox = 2, lantern = 3 }
after_secs = 45
timeout_secs = 420

[[shot.crop]]
name = "tabs"
rect = [0.0, 0.0, 1.0, 0.075]

# After the still, the same window through seven of the built-in themes, five seconds each,
# and back to the first, as a loop for the app's page (apps.csarko.sh): Navy's rune rain, the
# two watercolor themes' wash and ink, Matrix's phosphor rain and decode, Composition
# Notebook's cover and ruled pages, and Material's and Lavender Material's cards. The two short
# sessions have answered by then; the long ones go on working through the theme changes.

# The same moment in the Inbox layout, for the apps page's Inbox and Grid switch: the sessions as a list
# by what they ask of you, one shown at full size with the files it opened beside it.
[[shot]]
name = "dark-inbox"
theme = "dark"
layout = "inbox"
timeout_secs = 60

# The same moment in Navy, the theme Arkos starts in (the light slot here), for the apps page's
# gallery of every theme: `multitasker-navy.png`.
[[shot]]
name = "navy"
theme = "light"
timeout_secs = 60

# The Navy picture in the Inbox layout, for the apps page's Inbox and Grid switch: the sessions as a list
# by what they ask of you, one shown at full size with the files it opened beside it.
[[shot]]
name = "navy-inbox"
theme = "light"
layout = "inbox"
timeout_secs = 60

[[recording]]
name = "themes"
wait = { blog = "waiting", budget = "waiting" }
themes = ["tokyo-rain", "lavender-watercolor", "peach-watercolor", "matrix", "composition-notebook", "material", "lavender-material"]
hold_secs = 5

# The page's opening clip (cinema.py): the window held in Navy for eight seconds while the
# camera pulls back from its tab bar into the key art, every other persona's still fanned behind
# it. Those stills must exist in docs/images (shoot their scenes first).
[[recording]]
name = "hero"
wait = { blog = "waiting", budget = "waiting" }
themes = ["tokyo-rain"]
hold_secs = 8
# No backs named: every other persona's still stands behind the window, a new one included.
cinema = {}

# Both effects at a Retina Mac's density should the display draw one pixel a point (see the
# hacker); on a display at two, the shoot's virtual one included, the built-in scales stand.
[[effect]]
name = "runic"
scale = 1.0

[[effect]]
name = "watercolor"
scale = 1.0

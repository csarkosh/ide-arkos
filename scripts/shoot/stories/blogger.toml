# The blogger: a product person who lives in markdown. The launch plan rendered in the editor
# (a status table as a grid, a Mermaid flow, a checklist, an open-questions section, a chart),
# another post behind it, and a Claude Code session bringing the plan up to date from the notes.

[scene]
name = "blogger"
caption = "The blogger"

[demo]
name = "field-notes"
dir = "~/Projects/field-notes"
fixture = "scripts/shoot/demo/blog"

[window]
width = 1320
height = 860
preset = "comfortable"
sidebar_width = 240
expanded = ["posts", "notes"]
# A writer's look: the built-in peach-light theme, cream and peach, in both pictures.
theme = { dark = "peach-light", light = "peach-light" }
# Claude Code draws itself in the terminal's sixteen colours, which the theme sets.
claude_theme = "light-ansi"

[[pane]]
name = "launch plan"
view = "posts/2026-10-16-launch-plan.md"

[[pane]]
name = "decision logs"
view = "posts/2026-10-02-decision-logs.md"

[[pane]]
name = "assistant"
claude = "Read notes/launch-review.md and bring posts/2026-10-16-launch-plan.md up to date with it: change the status table rows the notes mention (keep the table's columns and the pipes aligned), tick the checklist item that is done, and add the new open question to the Open questions section. Keep the file's shape and voice, change nothing else, no em-dashes. When it is written, read it back once."

[layout]
split = "horizontal"
ratio = 0.6
first = { tabs = ["launch plan", "decision logs"] }
second = { tabs = ["assistant"] }

[[shot]]
name = "dark"
theme = "dark"
wait = { assistant = "working" }
changed = { assistant = 1 }
after_secs = 20
timeout_secs = 300

[[shot]]
name = "light"
theme = "light"
wait = { assistant = "waiting" }
timeout_secs = 300

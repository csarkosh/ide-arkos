# The blogger: a product person who lives in markdown. The launch plan rendered on top (a status
# table as a grid, a Mermaid flow, a checklist, an open-questions section, a chart) with the caret
# in it, since the rendered view is also where you edit, and below it a Claude Code session
# bringing the plan up to date from the notes. Narrow and tall, so the page has no empty right side.

[scene]
name = "blogger"
caption = "The blogger"

[demo]
name = "field-notes"
dir = "~/Projects/field-notes"
fixture = "scripts/shoot/demo/blog"

[window]
width = 960
height = 1000
preset = "comfortable"
sidebar_width = 240
expanded = ["posts", "notes"]
# A writer's look in both watercolor themes: Peach Watercolor in the dark slot for the first
# picture, Lavender Watercolor in the light slot for the second, the same moment of work in
# each, so the page can swap between them.
theme = { dark = "peach-watercolor", light = "lavender-watercolor" }

[[pane]]
name = "launch plan"
view = "posts/2026-10-16-launch-plan.md"

[[pane]]
name = "decision logs"
view = "posts/2026-10-02-decision-logs.md"

[[pane]]
name = "assistant"
claude = "Read notes/launch-review.md and bring posts/2026-10-16-launch-plan.md up to date with it: change the status table rows the notes mention (keep the table's columns and the pipes aligned), tick the checklist item that is done, and add the new open question to the Open questions section. Keep the file's shape and voice, change nothing else, no em-dashes. When it is written, read it back once."

[layout]
split = "vertical"
ratio = 0.52
first = { tabs = ["launch plan", "decision logs"] }
second = { tabs = ["assistant"] }

[[shot]]
name = "dark"
theme = "dark"
# Both pictures once the session has answered, so the swap between them changes only the theme.
wait = { assistant = "waiting" }
changed = { assistant = 1 }
after_secs = 20
timeout_secs = 300
click = [0.42, 0.17]

# The same moment in Lavender Watercolor (the light slot, though both themes are light), taken
# as soon as the first is: `blogger-lavender.png`.
[[shot]]
name = "lavender"
theme = "light"
wait = { assistant = "waiting" }
timeout_secs = 60

# The Peach Watercolor picture in the Inbox layout, for the apps page's Inbox and Grid switch: the sessions as a list
# by what they ask of you, one shown at full size with the files it opened beside it.
[[shot]]
name = "dark-inbox"
theme = "dark"
layout = "inbox"
timeout_secs = 60

# The Lavender Watercolor picture in the Inbox layout, for the apps page's Inbox and Grid switch: the sessions as a list
# by what they ask of you, one shown at full size with the files it opened beside it.
[[shot]]
name = "lavender-inbox"
theme = "light"
layout = "inbox"
timeout_secs = 60

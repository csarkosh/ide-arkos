# The web developer: a project with a worktree, Claude Code on a feature branch and on the
# main checkout, and the app's page in a web tab beside them, the whole height of the window.

[scene]
name = "web-developer"
caption = "The web developer"

[demo]
name = "lantern"
dir = "~/Projects/lantern"
fixture = "scripts/shoot/demo/lantern"
port = 4173
worktrees = ["rate-limit", "old-spike"]
# A spike nobody has touched for three weeks: the Worktrees list shows its age, dimmed.
aged = { "old-spike" = 21 }

[window]
width = 1320
height = 860
preset = "compact"
sidebar_width = 240
expanded = ["src"]
# The built-in lavender-material theme: lavender's colours as Material cards on a lavender frame.
theme = { dark = "lavender-material", light = "lavender-material" }

[[pane]]
name = "rate limit"
cwd = ".worktrees/rate-limit"
claude = "Add rate limiting to POST /links: 20 requests a minute per client address, answered 429 with a Retry-After header. Put the limiter in src/limiter.js with its own tests in test/limiter.test.js, wire it into src/server.js with tests for the route in test/server.test.js (start the server on a free port in the tests), add a GET /stats route that reports how many links exist and how many requests the limiter refused (with a test), document both in README.md, then run npm test and fix anything that fails."

[[pane]]
name = "durations"
claude = "Add tests for parseDuration in src/time.js to test/time.test.js: 30s, 5m, 2h, 1h30m, an empty string and junk. Run them."

[[pane]]
name = "site"
browser = "http://localhost:4173/"

[layout]
split = "horizontal"
ratio = 0.6
first = { tabs = ["rate limit", "durations"] }
second = { tabs = ["site"] }

[[shot]]
name = "dark"
theme = "dark"
wait = { "rate limit" = "working", durations = "waiting" }
changed = { "rate limit" = 3 }
after_secs = 30
timeout_secs = 360

# The same moment in the Inbox layout, for the apps page's Inbox and Grid switch: the sessions as a list
# by what they ask of you, one shown at full size with the files it opened beside it.
[[shot]]
name = "dark-inbox"
theme = "dark"
layout = "inbox"
timeout_secs = 60

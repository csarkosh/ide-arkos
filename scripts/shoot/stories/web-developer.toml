# The web developer: a project with a worktree, Claude Code on a feature branch and on the
# main checkout, and the app's page in a web tab beside them, the whole height of the window.

[scene]
name = "web-developer"
caption = "The web developer"

[demo]
name = "lantern"
dir = "~/Projects/lantern"
fixture = "scripts/shoot/demo/lantern"
port = 4173
worktrees = ["rate-limit", "old-spike"]
# A spike nobody has touched for three weeks: the Worktrees list shows its age, dimmed.
aged = { "old-spike" = 21 }

[window]
width = 1320
height = 860
preset = "compact"
sidebar_width = 240
expanded = ["src"]
# The built-in lavender-material theme: lavender's colours as Material cards on a lavender frame.
theme = { dark = "lavender-material", light = "lavender-material" }

[[pane]]
name = "rate limit"
cwd = ".worktrees/rate-limit"
claude = "Add rate limiting to POST /links: 20 requests a minute per client address, answered 429 with a Retry-After header. Put the limiter in src/limiter.js with its own tests in test/limiter.test.js, wire it into src/server.js with tests for the route in test/server.test.js (start the server on a free port in the tests), add a GET /stats route that reports how many links exist and how many requests the limiter refused (with a test), document both in README.md, then run npm test and fix anything that fails."

[[pane]]
name = "durations"
claude = "Add tests for parseDuration in src/time.js to test/time.test.js: 30s, 5m, 2h, 1h30m, an empty string and junk. Run them."

[[pane]]
name = "site"
browser = "http://localhost:4173/"

# For the Inbox's range: more sessions, each in another state. Needs you (deps asks a question), Later (og tags, put off two hours) and Done (dark mode, closed this afternoon), beside the two that finish.
[[pane]]
name = "deps"
claude = "Before you do anything else, use your AskUserQuestion tool to ask me one question: should I move the dependencies to their latest minor versions only, or to new major versions too? Offer those two as the options. Then wait for my answer."

[[pane]]
name = "og tags"
claude = ""
later_mins = 120
line = "Add Open Graph tags and a share image to the home page"

[[ended]]
name = "dark mode"
line = "The site follows the system's dark mode now, and both themes pass the contrast check."
mins_ago = 180

[layout]
split = "horizontal"
ratio = 0.6
first = { tabs = ["rate limit", "durations", "deps", "og tags"] }
second = { tabs = ["site"] }

[[shot]]
name = "dark"
theme = "dark"
wait = { "rate limit" = "working", durations = "waiting" }
changed = { "rate limit" = 3 }
after_secs = 30
timeout_secs = 360

# The same moment in the Inbox layout, for the apps page's Inbox and Grid switch: the sessions as a list
# by what they ask of you, one shown at full size with the files it opened beside it.
[[shot]]
name = "dark-inbox"
theme = "dark"
layout = "inbox"
timeout_secs = 60
# Side by side, as Cyrus asked for this one (2026-11-14): the files pane dragged by its number
# from the top, where a narrow window stacks it, onto the session's right edge.
drag = [[0.203, 0.059], [0.96, 0.72]]

# The same Inbox, its panes where the drag left them, in the other Material light themes, for
# the apps page's choice of the web developer's theme (Cyrus, 2026-11-19: every Material light
# theme).
[[shot]]
name = "solar-inbox"
theme = "material-solar"
layout = "inbox"
timeout_secs = 60

[[shot]]
name = "bright-inbox"
theme = "material"
layout = "inbox"
timeout_secs = 60

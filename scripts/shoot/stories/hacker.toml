# The hacker: a security engineer on a small file-drop service (the demo's bugs are planted for
# the audit to find, and it only ever runs as a target here). Claude Code audits the code while a
# second session fixes the path traversal behind it, a third reads the box's ssh log for a
# break-in, and a shell shows the end of that log. Shot in the built-in matrix theme with its
# matrix effect.

[scene]
name = "hacker"
caption = "The hacker"

[demo]
name = "parcel"
dir = "~/Projects/parcel"
fixture = "scripts/shoot/demo/parcel"

[window]
width = 1320
height = 860
preset = "compact"
sidebar_width = 240
expanded = ["src", "logs"]
theme = { dark = "matrix", light = "matrix" }

# The audit reads every file itself (a session waiting on background agents reports "waiting")
# and proves its findings with tests, so it is still working once the other two have answered.
# It starts with the code and is told not to report until the end: asked for findings first,
# it listed them in chat and ended its turn there, twice, under 40 s in.
[[pane]]
name = "audit"
claude = "Read every file in src/ yourself (no subagents) and find its security bugs. For each one except the path traversal (another session is fixing that), add a test to test/exploits.test.js that carries out the attack against the code as it is and passes while the bug is there; run npm test until every test passes. Then write findings.md with one short section per bug, most severe first: the file and line, how an attacker would use it, the fix, and the test that proves it. Do not change any file in src/. This is one job: do not report or summarise in chat until findings.md is written, and do not ask me anything."

[[pane]]
name = "traversal"
claude = "GET /files/:name in src/files.js lets a name like ..%2F..%2Fetc%2Fpasswd out of the uploads folder. Fix readUpload so only files inside uploads/ are served and anything else is refused, with a 400 from src/server.js. Add tests in test/files.test.js for a normal file, ../ and an encoded %2e%2e%2f, then run npm test."

[[pane]]
name = "logs"
claude = "Read logs/auth.log. Which addresses are brute-forcing ssh, how many attempts each, and did any of them get in? Answer with a short table, then the one thing I should do first. Do not change any file."

[[pane]]
name = "shell"
# A short prompt: the runner's host name is forty characters of noise.
run = "PS1='$ '; tail -n 30 logs/auth.log"

[layout]
split = "horizontal"
ratio = 0.58
first = { tabs = ["audit", "traversal"] }
second = { split = "vertical", ratio = 0.5, first = { tabs = ["logs"] }, second = { tabs = ["shell"] } }

[[shot]]
name = "dark"
theme = "dark"
wait = { audit = "working", traversal = "waiting", logs = "waiting" }
changed = { traversal = 2 }
after_secs = 45
timeout_secs = 420
# The decode is 400 ms on changed text, which a still frame never catches: a burst instead,
# while the audit writes.
burst = 20

# The rain's runes are a couple of points across: at the manifest's 0.5 on the runner's one
# pixel a point they blur away, so the wash draws at 1.0 there, a Retina Mac's density.
[effect]
name = "matrix"
scale = 1.0

# The hacker: a security engineer on a small file-drop service (the demo's bugs are planted for
# the audit to find, and it only ever runs as a target here). Claude Code audits and hardens the
# sign-in and the server while a second session fixes the path traversal behind it, a third reads
# the box's ssh log for a break-in, and a shell shows the end of that log. Shot in the built-in
# matrix theme with its effect, runic.

[scene]
name = "hacker"
caption = "The hacker"

[demo]
name = "parcel"
dir = "~/Projects/parcel"
fixture = "scripts/shoot/demo/parcel"

[window]
width = 1320
height = 860
preset = "compact"
sidebar_width = 240
expanded = ["src", "logs"]
theme = { dark = "matrix", light = "matrix" }

# The audit reads the files itself (a session waiting on background agents reports "waiting")
# and fixes what it finds with a regression test for each, so it is still writing, and its new
# lines decoding, once the other two have answered. Asked to prove each bug with a working
# exploit instead, it ended its turn early: once to list its findings in chat, and once when
# Claude Code's safety check stopped a command-injection proof and it asked how to go on.
[[pane]]
name = "audit"
claude = "Harden src/auth.js and src/server.js (leave src/files.js alone: another session is fixing it). Read both yourself, no subagents, and write findings.md with one short section per security bug, most severe first: the file and line, the risk, and the fix. Then fix every one, each with a regression test in test/security.test.js showing the bad input is now refused, and run npm test until it passes. Work straight through to the end without stopping to summarise or ask me anything."

[[pane]]
name = "traversal"
claude = "GET /files/:name in src/files.js lets a name like ..%2F..%2Fetc%2Fpasswd out of the uploads folder. Fix readUpload so only files inside uploads/ are served and anything else is refused, with a 400 from src/server.js. Add tests in test/files.test.js for a normal file, ../ and an encoded %2e%2e%2f, then run npm test."

[[pane]]
name = "logs"
claude = "Read logs/auth.log. Which addresses are brute-forcing ssh, how many attempts each, and did any of them get in? Answer with a short table, then the one thing I should do first. Do not change any file."

[[pane]]
name = "shell"
# A short prompt: the runner's host name is forty characters of noise.
run = "PS1='$ '; tail -n 30 logs/auth.log"

[layout]
split = "horizontal"
ratio = 0.58
first = { tabs = ["audit", "traversal"] }
second = { split = "vertical", ratio = 0.5, first = { tabs = ["logs"] }, second = { tabs = ["shell"] } }

[[shot]]
name = "dark"
theme = "dark"
wait = { audit = "working", traversal = "waiting", logs = "waiting" }
changed = { traversal = 2 }
after_secs = 45
timeout_secs = 420
# The decode is 400 ms on changed text, which a still frame never catches: a burst instead,
# while the audit writes.
burst = 40

# The rain's runes are a couple of points across: at the manifest's 0.5 on the runner's one
# pixel a point they blur away, so the wash draws at 1.0 there, a Retina Mac's density.
[effect]
name = "runic"
scale = 1.0

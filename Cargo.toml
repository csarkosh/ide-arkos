[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
telemetry = { path = "crates/telemetry" }
# The client half of lib-visits: the report types, consent, the journal and the queue.
visits-app = { git = "https://github.com/csarkosh/lib-visits", tag = "v0.3.1" }
# The panic hook's frames, unresolved.
backtrace = "0.3"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", features = ["alloc"] }
anyhow = "1"
libc = "0.2"
tempfile = "3"
ed25519-compact = { version = "2", default-features = false, features = ["random", "std"] }
base64 = "0.22"
sha2 = "0.10"
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false }
toml_edit = "0.22"

# Line tables only, and on macOS packed into target/release/<bin>.dSYM beside each binary: the
# release paths publish the two dSYMs with the app, so a crash report's frame offsets
# symbolicate with `atos` (docs/development.md). The code built is the same either way.
[profile.release]
debug = 1
split-debuginfo = "packed"

[profile.dev.package.pulldown-cmark]
opt-level = 3

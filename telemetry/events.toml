# The events Arkos records in a session's journal, the `d` keys each may carry and the values
# each key may take (telemetry spec, section 2.2). The file is compiled into both binaries
# (`telemetry::allowlist()`); an event, key or value it does not list is dropped and counted,
# never written. Each table is one event: a key lists its permitted values, "bool" admits true or
# false. `[focus]` lists the surfaces foreground time is counted against.
#
# A change here is a change to what Arkos sends: it gets one release note line, and the
# disclosure page renders from this file.

[events.launch]
how = ["normal", "relaunch", "updated", "recovered"]

[events.window_open]

[events.window_close]

[events.pane_open]
kind = ["terminal", "viewer", "browser"]
how = ["palette", "key", "click", "explorer", "link", "restore"]

[events.pane_close]
kind = ["terminal", "viewer", "browser"]

[events.view]
format = ["markdown", "code", "plain", "image", "video", "binary", "too_large"]
mode = ["rendered", "raw"]

[events.md]
feature = ["table_edit", "mermaid", "details", "checklist", "remote_image", "video", "inline_diff"]

[events.agent_launch]
agent = ["claude", "other"]
how = ["new", "resume"]

[events.agent_state]
agent = ["claude", "other"]
state = ["waiting"]

# The `keymap::Command` variants in snake case, one per palette command.
[events.palette]
command = [
    "focus_pane",
    "focus_dir",
    "split",
    "toggle_maximize",
    "move_tab_to_pane",
    "cycle_tab",
    "mru_tab",
    "close_tab",
    "reopen_closed_tab",
    "close_all_in_pane",
    "move_tab_within",
    "new_terminal",
    "clear_to_start",
    "font_delta",
    "about",
    "open_settings",
    "keybindings",
    "documentation",
    "open_config",
    "text_preset",
    "reload_config",
    "extract_themes",
    "command_palette",
    "set_theme",
    "find",
    "copy_as_shown",
    "update_now",
    "check_for_updates",
    "notifications",
    "doctor",
    "retry_update",
    "start_at_login",
    "install_hooks",
    "install_agent_guide",
    "toggle_sidebar",
    "focus_file_tree",
    "show_ignored_files",
    "focus_worktrees",
    "toggle_inline_diff",
    "toggle_markdown_view",
    "save_file",
    "open_folder",
    "new_window",
    "new_browser_tab",
    "new_browser_tab_single_page",
    "dock_chrome_window",
    "dock_chrome_window_at",
    "undock_chrome_window",
]

# The config keys, never their values. `font.presets.*` is collapsed to `font.presets` and the
# `[keybindings]` table to `keybindings`, so neither a preset's name nor an action's is sent.
[events.settings]
key = [
    "font.family",
    "font.preset",
    "font.presets",
    "terminal.scrollback",
    "terminal.shell",
    "terminal.nice",
    "terminal.option_as_meta",
    "keybindings",
    "sidebar.width",
    "sidebar.collapsed",
    "viewer.highlight_limit_bytes",
    "viewer.wide_tables",
    "browser.url",
    "browser.app_mode",
    "daemon.watchdog_secs",
    "daemon.replay_bytes",
    "theme.dark",
    "theme.light",
    "appearance.mode",
    "recovery.start_at_login",
    "update.auto",
    "update.check_every_secs",
    "update.idle_after_secs",
    "telemetry.usage",
    "telemetry.crashes",
]

# Whether the theme chosen is a built-in one; a theme is never named.
[events.theme]
builtin = "bool"

[events.update]
step = ["staged", "applied", "failed", "rolled_back"]

[events.notice]
kind = ["update_ready", "updated", "daemon", "config_error", "theme_error"]

[events.error]
kind = ["daemon_unreachable", "daemon_restarted", "session_lost", "chrome_missing", "mermaid_failed", "save_failed"]

[events.help]
what = ["keybindings", "documentation", "about", "telemetry"]

[focus]
surfaces = ["terminal", "viewer", "browser", "settings"]
